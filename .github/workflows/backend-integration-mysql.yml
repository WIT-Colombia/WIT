name: XAMUKO backend integration (MySQL 8.4)

on:
  workflow_dispatch:
  push:
    branches: [integration/preserve-all-20261029]
  pull_request:
    branches: [security/frontend-toolchain-20261030, integration/preserve-all-20261029]

permissions:
  contents: read

jobs:
  integration:
    name: Isolated backend integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Generate Prisma Client
        run: npm run prisma:generate
        working-directory: backend
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: backend
      - name: Run HTTP integration suite
        run: npm run test:integration:pro
        working-directory: backend
      - name: Run backend unit and finance coverage
        run: |
          set +e
          npm test > npm-test.log 2>&1
          status=$?
          cat npm-test.log
          echo "npm test exit code: $status" >> npm-test.log
          exit $status
        working-directory: backend
      - name: Upload backend unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-log
          path: backend/npm-test.log
          if-no-files-found: warn
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
        working-directory: backend
