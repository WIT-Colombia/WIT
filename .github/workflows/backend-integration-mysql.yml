name: XAMUKO backend integration (MySQL 8.4)

on:
  workflow_dispatch:
  push:
    branches: [integration/preserve-all-20261029]
  pull_request:
    branches: [security/frontend-toolchain-20261030, integration/preserve-all-20261029]

permissions:
  contents: read

jobs:
  integration:
    name: Isolated backend integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-root
          MYSQL_DATABASE: xamuko_integration_test
          MYSQL_USER: xamuko_test_app
          MYSQL_PASSWORD: integration-app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://xamuko_test_app:integration-app@127.0.0.1:3306/xamuko_integration_test
      AUTH_ACCESS_TOKEN_SECRET: ci-integration-secret-not-for-production-0123456789
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174
      GOOGLE_CLIENT_ID: ci-fake-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-fake-secret-not-for-production
      XAMUKO_TEST_API_URL: http://127.0.0.1:3100/api/v1
      XAMUKO_TEST_ORIGIN: http://127.0.0.1:5174
      ADMIN_PASSKEY_ACTIVATION_CODE_HASH: 5c55a2f6a1da4768a635d45e8b0e0ba1bae9786b6a8e3351c435800bcf852aea
      ADMIN_GOOGLE_SUB_ALLOWLIST: ci-admin-google-sub
      ADMIN_WEBAUTHN_RP_ID: localhost
      ADMIN_WEBAUTHN_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run HTTP integration suite
        run: npm run test:integration:pro
      - name: Run backend unit and finance coverage
        run: |
          set +e
          npm test > npm-test.log 2>&1
          status=$?
          cat npm-test.log
          echo "npm test exit code: $status" >> npm-test.log
          exit $status
      - name: Upload backend unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-log
          path: backend/npm-test.log
          if-no-files-found: warn
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
