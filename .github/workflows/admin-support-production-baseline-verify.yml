name: XAMUKO support backport - production baseline verification

on:
  push:
    branches:
      - feature/admin-support-on-production-20261114

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: xamuko_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=25
    env:
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/xamuko_test
      AUTH_ACCESS_TOKEN_SECRET: ci-test-secret-not-for-production-0123456789
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174
      GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: not-a-real-secret
      ADMIN_PASSKEY_ACTIVATION_CODE_HASH: 5c55a2f6a1da4768a635d45e8b0e0ba1bae9786b6a8e3351c435800bcf852aea
      ADMIN_GOOGLE_SUB_ALLOWLIST: ci-admin-google-sub
      ADMIN_WEBAUTHN_RP_ID: localhost
      ADMIN_WEBAUTHN_ORIGIN: http://localhost:5173
      ADMIN_WEBAUTHN_RP_NAME: XAMUKO CI
    steps:
      - name: Checkout exact backport
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend - install, generate, migrate isolated MySQL, typecheck, test and build
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run prisma:generate
          npx prisma migrate deploy
          npm run typecheck
          npm test
          npm run build
      - name: Frontend - install, typecheck, tests, build all apps
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:verification
          npm run build
      - name: Package backend (no production deployment)
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p release
          cp package.json package-lock.json prisma.config.ts tsconfig.json release/
          cp -R dist prisma release/
          npm ci --no-audit --no-fund --prefix release
          (cd release && ./node_modules/.bin/prisma migrate status)
          test -x release/node_modules/.bin/prisma
          printf '%s\n' "$GITHUB_SHA" > release/RELEASE_COMMIT
          tar -czf "xamuko-backend-$GITHUB_SHA.tar.gz" -C release .
          sha256sum "xamuko-backend-$GITHUB_SHA.tar.gz" > "xamuko-backend-$GITHUB_SHA.tar.gz.sha256"
      - name: Package frontends (no production deployment)
        run: |
          set -euo pipefail
          test -f frontend/apps/usuario/dist/index.html
          test -f frontend/apps/negocios/dist/index.html
          test -f frontend/apps/admin/dist/index.html
          tar -czf "xamuko-frontends-$GITHUB_SHA.tar.gz" -C frontend             apps/usuario/dist apps/negocios/dist apps/admin/dist
          sha256sum "xamuko-frontends-$GITHUB_SHA.tar.gz" > "xamuko-frontends-$GITHUB_SHA.tar.gz.sha256"
      - name: Upload backend verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: xamuko-backend-backport-${{ github.sha }}
          path: |
            backend/xamuko-backend-*.tar.gz
            backend/xamuko-backend-*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Upload frontend verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: xamuko-frontends-backport-${{ github.sha }}
          path: |
            xamuko-frontends-*.tar.gz
            xamuko-frontends-*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
