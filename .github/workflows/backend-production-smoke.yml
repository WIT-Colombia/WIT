name: XAMUKO backend post-deployment smoke (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regression tests for probe integrity
        run: node --test scripts/backend-production-smoke.test.mjs
      - name: Probe public API and anonymous Admin authorization
        env:
          XAMUKO_PROBE_ORIGIN: https://api.xamuko.com
        run: node scripts/backend-production-smoke.mjs
