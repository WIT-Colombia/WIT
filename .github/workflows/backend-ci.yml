name: XAMUKO Backend CI

on:
  pull_request:
  push:
    branches:
      - feature/xamuko-backend-security

jobs:
  backend:
    name: Security, build and tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: xamuko_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: development
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/xamuko_test
      ADMIN_PASSKEY_ACTIVATION_CODE_HASH: 8f1e4e6f1d0b1f9a41b4f1a8d5c3e2a9d8f7e6c5b4a39281716151413121110
      AUTH_ACCESS_TOKEN_SECRET: ci-test-secret-not-for-production-0123456789
      GOOGLE_CLIENT_ID: xamuko-test.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-secret-not-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Automated tests
        run: npm test
