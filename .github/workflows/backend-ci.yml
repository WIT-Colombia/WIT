name: XAMUKO Backend CI

on:
  pull_request:
  push:
    branches:
      - feature/xamuko-backend-security
      - integration/preserve-all-20261029

jobs:
  backend:
    name: Security, build and tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: xamuko_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: development
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/xamuko_test
      ADMIN_PASSKEY_ACTIVATION_CODE_HASH: 5c55a2f6a1da4768a635d45e8b0e0ba1bae9786b6a8e3351c435800bcf852aea
      ADMIN_GOOGLE_SUB_ALLOWLIST: ci-admin-google-sub
      ADMIN_WEBAUTHN_RP_ID: 127.0.0.1
      ADMIN_WEBAUTHN_ORIGIN: http://127.0.0.1
      ADMIN_WEBAUTHN_RP_NAME: XAMUKO CI
      AUTH_ACCESS_TOKEN_SECRET: ci-test-secret-not-for-production-0123456789
      GOOGLE_CLIENT_ID: xamuko-test.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-secret-not-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Automated tests
        run: npm test
