name: XAMUKO Backend CI

on:
  pull_request:
  push:
    branches:
      - feature/xamuko-backend-security

jobs:
  backend:
    name: Security, build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: development
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/xamuko_test
      AUTH_ACCESS_TOKEN_SECRET: ci-test-secret-not-for-production-0123456789
      GOOGLE_CLIENT_ID: xamuko-test.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-secret-not-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Automated tests
        run: npm test
