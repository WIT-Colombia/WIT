name: XAMUKO frontend validation

on:
  push:
    branches: [integration/preserve-all-20261029]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    branches: [integration/preserve-all-20261029]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation for a branch/PR; obsolete builds waste time
# while preserving the complete validation suite for the latest commit.
concurrency:
  group: xamuko-frontend-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all applications
        run: npm run typecheck

      - name: Run available frontend tests
        run: |
          npm run test --workspace=@wit/admin --if-present
          npm run test --workspace=@wit/usuario --if-present

      - name: Build all applications
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
