name: XAMUKO frontend validation

on:
  push:
    branches: [integration/preserve-all-20261029]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    branches: [integration/preserve-all-20261029]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation for a branch/PR; obsolete builds waste time
# while preserving the complete validation suite for the latest commit.
concurrency:
  group: xamuko-frontend-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck all applications
        working-directory: frontend
        run: npm run typecheck

      - name: Run available frontend tests
        run: |
          npm run test --workspace=@wit/admin --if-present
          npm run test --workspace=@wit/usuario --if-present
          npm run test --workspace=@wit/negocios --if-present
          npm run test:location --workspace=@wit/usuario

      - name: Build all applications
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for Admin sidebar check
        run: npx playwright install --with-deps chromium

      - name: Check Usuario offer card geometry on iPhone and iPad
        run: node scripts/check-usuario-offer-cards.mjs

      - name: Check Admin sidebar in desktop and mobile browsers
        run: node scripts/check-admin-sidebar.mjs

      - name: Save Usuario offer card screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xamuko-usuario-offer-cards-${{ github.run_id }}
          path: frontend/test-results/offer-cards/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Admin sidebar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xamuko-admin-sidebar-${{ github.run_id }}
          path: frontend/test-results/admin-sidebar/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package isolated Pages previews (Usuario and Business only)
        if: github.event_name == 'pull_request'
        working-directory: frontend
        run: |
          test -s apps/usuario/dist/index.html
          test -s apps/negocios/dist/index.html
          test -d apps/usuario/dist/assets
          test -d apps/negocios/dist/assets

      - name: Save Usuario Pages release candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: xamuko-usuario-pages-pr-${{ github.event.pull_request.number }}
          path: frontend/apps/usuario/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Save Business Pages release candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: xamuko-business-pages-pr-${{ github.event.pull_request.number }}
          path: frontend/apps/negocios/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
