name: XAMUKO frontend validation

on:
  push:
    branches: [integration/preserve-all-20261029, ci/validate-integration-20261030]
  pull_request:
    branches: [integration/preserve-all-20261029]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all applications
        run: npm run typecheck

      - name: Run available frontend tests
        run: npm run test --workspace=@wit/admin --if-present

      - name: Build all applications
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
