# Manual installation template only. DO NOT enable until DNS points to this server,
# a valid certificate for admin.xamuko.com exists and the server's current
# configuration has been reviewed. This file is NOT automatically installed.
server {
    listen 80;
    server_name admin.xamuko.com;
    return 301 https://admin.xamuko.com$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.xamuko.com;

    # Set the REAL certificate paths before enabling. These are examples.
    ssl_certificate /etc/letsencrypt/live/admin.xamuko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.xamuko.com/privkey.pem;

    root /opt/xamuko/deploy/current/admin;
    index index.html;
    server_tokens off;

    # API uses the existing hardened backend; no new port is exposed.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
